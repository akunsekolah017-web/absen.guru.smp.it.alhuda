<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Absensi Guru - SMP IT Al Huda</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Gradasi Khas Sekolah */
        .bg-gradient-school {
            background: linear-gradient(135deg, #15803d 0%, #166534 100%);
        }

        /* Animasi Kustom */
        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Kelas Animasi */
        .animate-fade-in-up {
            animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .animate-pulse-dot {
            animation: pulseDot 1.5s infinite;
        }

        /* Transisi khusus untuk perpindahan section */
        .section-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-gray-50 to-gray-200 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div class="bg-white rounded-2xl shadow-2xl p-6 w-full max-w-md border border-gray-100 animate-fade-in-up">
        
        <div class="text-center mb-6">
            <img src="Brosur Spmb SMP IT AL HUDA - 9.png" alt="Logo SMP IT Al Huda" class="w-24 h-24 mx-auto object-contain drop-shadow-md mb-2 rounded-xl transition-transform duration-500 hover:scale-105">
            <h1 class="text-xl font-bold text-gray-800 tracking-wide">SMP IT AL HUDA</h1>
            <p class="text-sm text-gray-500">Sistem Informasi Absensi Guru Online</p>
        </div>

        <hr class="border-gray-100 mb-6">

        <div id="authSection" class="section-transition">
            <div class="flex justify-center space-x-4 mb-6 bg-gray-100 p-1 rounded-xl relative">
                <button id="tabLogin" onclick="switchAuthTab('login')" class="w-1/2 py-2 text-sm font-semibold rounded-lg bg-white text-green-700 shadow-sm transition-all duration-300 cursor-pointer">Login</button>
                <button id="tabRegister" onclick="switchAuthTab('register')" class="w-1/2 py-2 text-sm font-semibold rounded-lg text-gray-600 hover:text-green-700 transition-all duration-300 cursor-pointer">Buat Akun</button>
            </div>

            <form id="authForm" onsubmit="handleAuth(event)" class="space-y-4">
                <h3 id="authTitle" class="text-lg font-semibold text-gray-700 transition-all duration-300">Masuk ke Akun Anda</h3>
                
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Alamat Email</label>
                    <div class="relative group">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 group-focus-within:text-green-600 transition-colors">
                            <i class="fa-solid fa-envelope"></i>
                        </span>
                        <input type="email" id="authEmail" required class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-transparent text-sm transition-all bg-gray-50/50 focus:bg-white" placeholder="nama@email.com">
                    </div>
                </div>

                <div class="mb-2">
                    <label class="block text-sm font-medium text-gray-600 mb-1">Kata Sandi</label>
                    <div class="relative group">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-gray-400 group-focus-within:text-green-600 transition-colors">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="authPassword" required class="w-full pl-10 pr-3 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-600 focus:border-transparent text-sm transition-all bg-gray-50/50 focus:bg-white" placeholder="••••••••">
                    </div>
                </div>

                <button type="submit" id="btnAuthSubmit" class="w-full bg-gradient-school text-white py-3 rounded-xl font-medium shadow-md shadow-green-900/10 hover:opacity-95 transition-all transform active:scale-98 cursor-pointer flex items-center justify-center gap-2 text-sm mt-6">
                    <span>Masuk</span> <i class="fa-solid fa-right-to-bracket"></i>
                </button>
            </form>
        </div>

        <div id="absensiSection" class="hidden section-transition opacity-0 scale-95">
            <div class="bg-green-50 border border-green-100 text-green-800 p-3 rounded-xl flex items-center justify-between mb-4 text-xs shadow-sm">
                <div class="flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-user text-base text-green-600"></i> Guru: <span id="userDisplay" class="font-bold"></span>
                </div>
                <button onclick="logout()" class="text-red-600 hover:text-red-700 hover:underline font-semibold transition-colors cursor-pointer flex items-center gap-1">
                    <i class="fa-solid fa-sign-out-alt"></i> Keluar
                </button>
            </div>

            <div class="bg-gray-50 border border-gray-100 rounded-xl p-3 text-center mb-4 shadow-inner">
                <div class="text-[10px] font-bold text-gray-400 uppercase tracking-widest">Tanggal Hari Ini</div>
                <div id="tanggalDisplay" class="text-base font-bold text-gray-700 mt-0.5"></div>
            </div>

            <form onsubmit="handleAbsen(event)" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1">Nama Lengkap Guru</label>
                    <input type="text" id="namaGuru" required class="w-full px-3 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-green-600 text-sm transition-all" placeholder="Nama beserta gelar">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Status Absen</label>
                        <select id="tipeAbsen" class="w-full px-3 py-2 border border-gray-300 rounded-xl bg-white focus:outline-none focus:ring-2 focus:ring-green-600 text-sm transition-all">
                            <option value="Datang">Jam Kedatangan</option>
                            <option value="Pulang">Jam Kepulangan</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Waktu Real-time</label>
                        <input type="text" id="waktuAbsen" readonly class="w-full px-3 py-2 border border-gray-200 rounded-xl bg-gray-50 text-gray-600 font-mono text-sm text-center font-bold shadow-inner">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-600 mb-1.5">Ambil Foto Bukti (Wajib)</label>
                    <div class="relative w-full h-48 bg-gray-900 rounded-xl overflow-hidden border border-gray-300 flex items-center justify-center group shadow-md">
                        <video id="video" class="w-full h-full object-cover hidden transition-all duration-300" autoplay playsinline></video>
                        <canvas id="canvas" class="hidden"></canvas>
                        <img id="photoPreview" class="hidden w-full h-full object-cover transition-all duration-300" alt="Hasil Foto">
                        
                        <div id="liveIndicator" class="absolute top-3 right-3 bg-red-600 text-white px-2 py-0.5 rounded-full text-[10px] font-bold tracking-wider uppercase hidden items-center gap-1 shadow animate-pulse-dot">
                            <span class="w-1.5 h-1.5 bg-white rounded-full"></span> Live
                        </div>

                        <div id="cameraPlaceholder" class="absolute text-center text-gray-400 p-2 transition-transform group-hover:scale-105 duration-300">
                            <i class="fa-solid fa-camera text-4xl mb-2 text-gray-500"></i>
                            <p class="text-xs font-medium">Klik "Aktifkan Kamera" terlebih dahulu</p>
                        </div>
                    </div>

                    <div class="flex space-x-3 mt-3">
                        <button type="button" onclick="startCamera()" class="flex-1 bg-gray-700 text-white py-2 px-2 rounded-xl text-xs font-medium hover:bg-gray-800 transition-all transform active:scale-95 shadow-sm cursor-pointer flex items-center justify-center gap-1">
                            <i class="fa-solid fa-video"></i> Aktifkan Kamera
                        </button>
                        <button type="button" id="btnAmbilFoto" onclick="takeSnapshot()" disabled class="flex-1 bg-blue-600 text-white py-2 px-2 rounded-xl text-xs font-medium hover:bg-blue-700 transition-all transform active:scale-95 disabled:opacity-40 disabled:scale-100 shadow-sm cursor-pointer flex items-center justify-center gap-1">
                            <i class="fa-solid fa-camera"></i> Ambil Foto
                        </button>
                    </div>
                </div>

                <button type="submit" id="btnSubmitAbsen" class="w-full bg-gradient-school text-white py-3 rounded-xl font-semibold shadow-md shadow-green-900/10 hover:opacity-95 transition-all transform active:scale-98 text-sm cursor-pointer flex items-center justify-center gap-2 mt-2">
                    <span>Kirim Data Absensi</span> <i class="fa-solid fa-paper-plane text-xs"></i>
                </button>
            </form>
        </div>
    </div>

    <div class="text-center text-xs text-gray-400 mt-4 tracking-wide">&copy; 2026 SMP IT Al Huda. All rights reserved.</div>

    <script>
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzsocr1valP5npAliPLHYauuroEY37xmGzvqxbPsryjA-8O2XteomxopTac23yMBAOvyg/exec";

        let currentMode = 'login';
        let stream = null;
        let base64Image = "";

        function updateDateTime() {
            const sekarang = new Date();
            const opsiTanggal = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            document.getElementById('tanggalDisplay').innerText = sekarang.toLocaleDateString('id-ID', opsiTanggal);

            const jam = String(sekarang.getHours()).padStart(2, '0');
            const menit = String(sekarang.getMinutes()).padStart(2, '0');
            const detik = String(sekarang.getSeconds()).padStart(2, '0');
            const strWaktu = `${jam}:${menit}:${detik} WIB`;
            
            const waktuField = document.getElementById('waktuAbsen');
            if (waktuField) waktuField.value = strWaktu;
        }

        setInterval(updateDateTime, 1000);

        function switchAuthTab(mode) {
            currentMode = mode;
            const tabLogin = document.getElementById('tabLogin');
            const tabRegister = document.getElementById('tabRegister');
            const authTitle = document.getElementById('authTitle');
            const btnAuthSubmit = document.getElementById('btnAuthSubmit');

            if (mode === 'login') {
                tabLogin.className = "w-1/2 py-2 text-sm font-semibold rounded-lg bg-white text-green-700 shadow-sm transition-all duration-300 cursor-pointer";
                tabRegister.className = "w-1/2 py-2 text-sm font-semibold rounded-lg text-gray-600 hover:text-green-700 transition-all duration-300 cursor-pointer";
                authTitle.innerText = "Masuk ke Akun Anda";
                btnAuthSubmit.innerHTML = '<span>Masuk</span> <i class="fa-solid fa-right-to-bracket"></i>';
            } else {
                tabRegister.className = "w-1/2 py-2 text-sm font-semibold rounded-lg bg-white text-green-700 shadow-sm transition-all duration-300 cursor-pointer";
                tabLogin.className = "w-1/2 py-2 text-sm font-semibold rounded-lg text-gray-600 hover:text-green-700 transition-all duration-300 cursor-pointer";
                authTitle.innerText = "Buat Akun Baru Guru";
                btnAuthSubmit.innerHTML = '<span>Buat Akun</span> <i class="fa-solid fa-user-plus"></i>';
            }
        }

        function handleAuth(event) {
            event.preventDefault();
            const email = document.getElementById('authEmail').value;
            const authSection = document.getElementById('authSection');
            const absensiSection = document.getElementById('absensiSection');

            // Efek transisi keluar seksion auth
            authSection.classList.add('opacity-0', 'scale-95');
            
            setTimeout(() => {
                authSection.classList.add('hidden');
                absensiSection.classList.remove('hidden');
                
                // Efek masuk seksion absensi
                setTimeout(() => {
                    absensiSection.classList.remove('opacity-0', 'scale-95');
                    absensiSection.classList.add('opacity-100', 'scale-100');
                }, 50);

                document.getElementById('userDisplay').innerText = email;
                updateDateTime();
            }, 400);
        }

        function logout() {
            stopCamera();
            const authSection = document.getElementById('authSection');
            const absensiSection = document.getElementById('absensiSection');

            absensiSection.classList.remove('opacity-100', 'scale-100');
            absensiSection.classList.add('opacity-0', 'scale-95');

            setTimeout(() => {
                absensiSection.classList.add('hidden');
                authSection.classList.remove('hidden');
                
                setTimeout(() => {
                    authSection.classList.remove('opacity-0', 'scale-95');
                }, 50);

                document.getElementById('authForm').reset();
                resetCameraView();
            }, 400);
        }

        async function startCamera() {
            resetCameraView();
            document.getElementById('cameraPlaceholder').classList.add('hidden');
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: false });
                const video = document.getElementById('video');
                video.srcObject = stream;
                video.classList.remove('hidden');
                document.getElementById('btnAmbilFoto').disabled = false;
            } catch (err) {
                alert("Gagal mengakses kamera. Mohon berikan izin browser.");
                document.getElementById('cameraPlaceholder').classList.remove('hidden');
            }
        }

        function takeSnapshot() {
            const video = document.getElementById('video');
            const canvas = document.getElementById('canvas');
            const photoPreview = document.getElementById('photoPreview');

            if (stream) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                const context = canvas.getContext('2d');
                context.drawImage(video, 0, 0, canvas.width, canvas.height);

                base64Image = canvas.toDataURL('image/jpeg');
                photoPreview.src = base64Image;
                
                video.classList.add('hidden');
                photoPreview.classList.remove('hidden');
                document.getElementById('liveIndicator').style.display = 'none';
                stopCamera();
            }
        }

        function stopCamera() {
            if (stream) stream.getTracks().forEach(track => track.stop());
            document.getElementById('btnAmbilFoto').disabled = true;
            document.getElementById('liveIndicator').style.display = 'none';
        }

        function resetCameraView() {
            document.getElementById('video').classList.add('hidden');
            document.getElementById('photoPreview').classList.add('hidden');
            document.getElementById('cameraPlaceholder').classList.remove('hidden');
            document.getElementById('liveIndicator').style.display = 'none';
            base64Image = "";
        }

        function handleAbsen(event) {
            event.preventDefault();
            const nama = document.getElementById('namaGuru').value;
            const tipe = document.getElementById('tipeAbsen').value;
            const waktu = document.getElementById('waktuAbsen').value;
            const tanggal = document.getElementById('tanggalDisplay').innerText;

            if (!base64Image) {
                alert('⚠️ Anda wajib mengambil foto sebagai bukti kehadiran!');
                return;
            }

            const btnSubmit = document.getElementById('btnSubmitAbsen');
            btnSubmit.disabled = true;
            btnSubmit.innerHTML = '<span>Mengirim data & foto...</span> <i class="fa-solid fa-spinner animate-spin"></i>';

            const payload = {
                nama: nama,
                tipe: tipe,
                waktu: waktu,
                tanggal: tanggal,
                foto: base64Image
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(payload)
            })
            .then(() => {
                alert('✅ Data Absensi sedang diproses!\nSilakan periksa folder Google Drive Anda dalam beberapa saat.');
                document.getElementById('namaGuru').value = '';
                resetCameraView();
            })
            .catch(err => {
                console.error(err);
                alert('Terjadi kesalahan pengiriman. Pastikan laptop terhubung ke internet.');
            })
            .finally(() => {
                btnSubmit.disabled = false;
                btnSubmit.innerHTML = '<span>Kirim Data Absensi</span> <i class="fa-solid fa-paper-plane text-xs"></i>';
            });
        }
    </script>
</body>
</html>
